<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Gallery</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      max-width: 1000px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      height: 250px;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    @media (max-width: 600px) {
      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>Image Gallery</h1>

  <div class="gallery">
    <img src="https://picsum.photos/id/1015/600/400" alt="Gallery image">
    <img src="https://picsum.photos/id/1016/600/400" alt="Gallery image">
    <img src="https://picsum.photos/id/1018/600/400" alt="Gallery image">
    <img src="https://picsum.photos/id/1020/600/400" alt="Gallery image">
    <img src="https://picsum.photos/id/1024/600/400" alt="Gallery image">
    <img src="https://picsum.photos/id/1025/600/400" alt="Gallery image">
  </div>

</body>
</html>
