<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .card {
            width: 280px;
            background-color: white;
            border: 1px solid #ccc;
            margin: 0 auto;
            padding: 20px;
        }

        .card h1 {
            margin: 0 0 10px;
        }

        .card p {
            margin: 8px 0;
        }

        .card button {
            margin-top: 12px;
            padding: 8px 14px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Alex Kumar</h1>
        <p>Web Developer</p>
        <p>Enjoys creating simple and useful websites.</p>
        <button>Contact</button>
    </div>
</body>
</html>
