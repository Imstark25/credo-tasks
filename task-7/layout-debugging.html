<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Debugging Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .layout {
            display: flow-root;
            background-color: #eeeeee;
            padding: 15px;
        }

        .heading {
            margin: 0 0 15px;
        }

        .columns {
            display: flex;
            gap: 15px;
        }

        .column {
            flex: 1;
            min-height: 100px;
            padding: 15px;
            background-color: lightblue;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="layout">
        <h1 class="heading">Fixed Layout</h1>
        <div class="columns">
            <div class="column">Column one</div>
            <div class="column">Column two</div>
        </div>
    </div>
</body>
</html>
