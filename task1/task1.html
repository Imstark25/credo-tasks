<!DOCTYPE html>
<html>

<head>
    <title>My Layout</title>

    <style>

        body {
            margin: 0;
        }

        .menu {
            height: 100px;
            background-color: lightblue;
            text-align: center;
            font-size: 30px;
            padding-top: 20px;
            box-sizing: border-box;
        }

        .header {
            height: 130px;
            background-color: yellow;
            text-align: center;
            font-size: 30px;
            padding-top: 40px;
            box-sizing: border-box;
        }

        .main {
            display: flex;
            height: 400px;
        }

        .sidebar {
            width: 25%;
            background-color: lime;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        .content {
            width: 75%;
            background-color: lightcoral;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        .footer {
            height: 130px;
            background-color: cyan;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

    </style>

</head>

<body>

    <div class="menu">
        Menu
    </div>

    <div class="header">
        Header
    </div>

    <div class="main">

        <div class="sidebar">
            Sidebar
        </div>

        <div class="content">
            Content
        </div>

    </div>

    <div class="footer">
        Footer
    </div>

</body>

</html>
