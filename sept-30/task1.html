
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Accessible Button</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }

        button {
            background-color: #1d9625;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:focus-visible {
            outline: 3px solid rgb(255, 0, 132);
            outline-offset: 3px;
        }
    </style>
</head>

<body>

    <h2>Accessible Button Implementation</h2>

    <button
        type="button"
        aria-label="Submit the form"
        onclick="alert('Form submitted successfully!')">

        Submit

    </button>

</body>
</html>
